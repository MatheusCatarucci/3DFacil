<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fácil - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-8">
        <h1 class="text-2xl font-semibold text-violet-400">{{ titulo }}</h1>
        <p class="mt-3 text-slate-300">
            Servidor funcionando. FastAPI, Jinja2 e Tailwind estão conectados.
        </p>
        <p class="mt-4 text-sm text-slate-500">
            Ambiente: <span class="text-slate-300">{{ ambiente }}</span>
        </p>
    </main>
</body>

</html>
